<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>اردو وائس اسٹوڈیو AI</title>

    <meta
        name="description"
        content="اردو وائس اسٹوڈیو AI — قدرتی اور واضح آواز کے ساتھ اردو ٹیکسٹ کو آواز میں تبدیل کریں۔"
    >

    <meta
        name="theme-color"
        content="#071f24"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =================================================
           STUDIO INTRO
        ================================================= */

        .studio-page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 190, 130, 0.10),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 30% 30%,
                    rgba(45, 170, 160, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 70% 65%,
                    rgba(90, 85, 180, 0.12),
                    transparent 35%
                ),
                #071f24;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .studio-intro {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(24, 74, 77, 0.22),
                    rgba(4, 20, 24, 0.98) 70%
                );

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        .studio-intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =================================================
           LIGHT / MIST
        ================================================= */

        .intro-light {
            position: absolute;
            width: 320px;
            height: 320px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 211, 160, 0.22) 0%,
                    rgba(69, 177, 166, 0.10) 35%,
                    transparent 72%
                );

            filter: blur(18px);

            animation:
                introLight 4s ease-in-out infinite;
        }

        @keyframes introLight {

            0% {
                transform: scale(0.45);
                opacity: 0.15;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.75;
            }

            100% {
                transform: scale(0.65);
                opacity: 0.25;
            }
        }

        /* =================================================
           CENTRAL POINT
        ================================================= */

        .intro-core {
            position: relative;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background: rgba(255, 220, 175, 0.95);

            box-shadow:
                0 0 10px rgba(255, 220, 175, 0.85),
                0 0 30px rgba(255, 170, 120, 0.55),
                0 0 70px rgba(66, 185, 175, 0.35);

            animation:
                coreExpand 2.2s
                cubic-bezier(.22,.61,.36,1)
                forwards;
        }

        @keyframes coreExpand {

            0% {
                width: 5px;
                height: 5px;
                opacity: 0;
                transform: scale(0.5);
            }

            20% {
                opacity: 1;
            }

            55% {
                width: 35px;
                height: 35px;
                transform: scale(1);
            }

            100% {
                width: 190px;
                height: 190px;
                opacity: 0;
                transform: scale(1.25);
            }
        }

        /* =================================================
           LOGO
        ================================================= */

        .intro-logo-wrap {
            position: absolute;

            width: min(330px, 70vw);

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0;

            transform:
                scale(0.15)
                rotate(-18deg);

            filter:
                blur(10px)
                drop-shadow(
                    0 0 0 rgba(255, 211, 160, 0)
                );

            animation:
                logoReveal 3.8s
                cubic-bezier(.18,.72,.25,1)
                1.1s
                forwards;
        }

        .intro-logo {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }

        @keyframes logoReveal {

            0% {
                opacity: 0;
                transform:
                    scale(0.08)
                    rotate(-20deg);

                filter:
                    blur(14px)
                    drop-shadow(
                        0 0 0
                        rgba(255, 211, 160, 0)
                    );
            }

            25% {
                opacity: 0.25;
            }

            55% {
                opacity: 0.78;

                transform:
                    scale(0.82)
                    rotate(5deg);

                filter:
                    blur(3px)
                    drop-shadow(
                        0 0 35px
                        rgba(255, 211, 160, 0.30)
                    );
            }

            78% {
                opacity: 1;

                transform:
                    scale(1.05)
                    rotate(-2deg);

                filter:
                    blur(0)
                    drop-shadow(
                        0 0 48px
                        rgba(68, 186, 174, 0.32)
                    );
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);

                filter:
                    blur(0)
                    drop-shadow(
                        0 0 28px
                        rgba(255, 211, 160, 0.20)
                    );
            }
        }

        /* =================================================
           INTRO TEXT
        ================================================= */

        .intro-caption {
            position: absolute;

            bottom: 12%;

            text-align: center;

            opacity: 0;

            animation:
                captionReveal 1.5s ease
                3.4s
                forwards;
        }

        .intro-caption strong {
            display: block;

            color: rgba(255, 235, 215, 0.95);

            font-size: 1.1rem;

            font-weight: 600;

            letter-spacing: 0.02em;
        }

        .intro-caption span {
            display: block;

            margin-top: 7px;

            color: rgba(190, 220, 220, 0.68);

            font-size: 0.78rem;
        }

        @keyframes captionReveal {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =================================================
           MAIN STUDIO
        ================================================= */

        .studio-content {

            width: min(1180px, 92%);

            padding: 40px 0;

            opacity: 0;

            transform: translateY(20px);

            animation:
                studioReveal 1.2s ease
                5.2s
                forwards;
        }

        @keyframes studioReveal {

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .studio-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }

        .studio-brand {

            display: flex;

            align-items: center;

            gap: 15px;
        }

        .studio-brand-logo {

            width: 58px;
            height: 58px;

            object-fit: contain;

            border-radius: 14px;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(255, 211, 160, 0.18)
                );
        }

        .studio-brand h1 {

            margin: 0;

            color: #fff;

            font-size: clamp(
                1.25rem,
                3vw,
                1.8rem
            );
        }

        .studio-brand p {

            margin: 4px 0 0;

            color: rgba(210, 230, 230, 0.65);

            font-size: 0.85rem;
        }

        .studio-status {

            padding: 8px 14px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color:
                rgba(230,245,245,0.72);

            font-size: 0.78rem;
        }

        /* =================================================
           WORKSPACE
        ================================================= */

        .studio-workspace {

            display: grid;

            grid-template-columns:
                minmax(0, 1.6fr)
                minmax(280px, 0.8fr);

            gap: 22px;
        }

        .studio-panel {

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 24px;

            padding: 24px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.20);

            backdrop-filter: blur(14px);

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }

        .studio-panel:hover {

            transform: translateY(-3px);

            border-color:
                rgba(255, 211, 160, 0.18);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.27);
        }

        .studio-panel h2 {

            margin: 0 0 8px;

            color: #fff;

            font-size: 1.15rem;
        }

        .studio-panel-description {

            margin: 0 0 20px;

            color:
                rgba(205,225,225,0.65);

            font-size: 0.84rem;

            line-height: 1.7;
        }

        .studio-textarea {

            width: 100%;

            min-height: 360px;

            resize: vertical;

            box-sizing: border-box;

            padding: 18px;

            border-radius: 17px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            outline: none;

            background:
                rgba(3, 20, 24, 0.55);

            color: #fff;

            font-family:
                "Noto Nastaliq Urdu",
                "Noto Sans Arabic",
                sans-serif;

            font-size: 1.05rem;

            line-height: 2;

            direction: rtl;

            transition:
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .studio-textarea::placeholder {

            color:
                rgba(205,225,225,0.38);
        }

        .studio-textarea:focus {

            border-color:
                rgba(255,211,160,0.30);

            box-shadow:
                0 0 0 4px
                rgba(255,211,160,0.05);
        }

        /* =================================================
           CONTROLS
        ================================================= */

        .studio-controls {

            display: grid;

            gap: 14px;

            margin-top: 18px;
        }

        .studio-control {

            padding: 15px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.055);
        }

        .studio-control label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(230,245,245,0.76);

            font-size: 0.8rem;
        }

        .studio-select {

            width: 100%;

            box-sizing: border-box;

            padding: 11px 12px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(3,20,24,0.75);

            color: #fff;

            outline: none;
        }

        .studio-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 18px;
        }

        .studio-button {

            border: none;

            border-radius: 12px;

            padding: 12px 18px;

            cursor: pointer;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    rgba(52,145,139,0.90),
                    rgba(72,77,150,0.90)
                );

            box-shadow:
                0 8px 24px
                rgba(40,100,110,0.16);

            transition:
                transform .25s ease,
                filter .25s ease,
                box-shadow .25s ease;
        }

        .studio-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.12);

            box-shadow:
                0 12px 30px
                rgba(75,120,150,0.25);
        }

        .studio-button.secondary {

            background:
                rgba(255,255,255,0.06);
        }

        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 800px) {

            .studio-workspace {

                grid-template-columns: 1fr;
            }

            .studio-header {

                align-items: flex-start;

                flex-direction: column;
            }

            .studio-status {

                align-self: flex-start;
            }

            .studio-panel {

                padding: 18px;
            }

            .studio-textarea {

                min-height: 280px;
            }

            .intro-logo-wrap {

                width: min(270px, 72vw);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .intro-light,
            .intro-core,
            .intro-logo-wrap,
            .intro-caption,
            .studio-content {

                animation: none !important;
            }

            .intro-logo-wrap {

                opacity: 1;

                transform: none;

                filter: none;
            }

            .intro-caption {

                opacity: 1;
            }

            .studio-content {

                opacity: 1;

                transform: none;
            }
        }

    </style>
</head>

<body>

    <div class="studio-page">

        <!-- =================================================
             INTRO
        ================================================= -->

        <section
            class="studio-intro"
            id="studioIntro"
            aria-label="اردو وائس اسٹوڈیو AI"
        >

            <div class="intro-light"></div>

            <div class="intro-core"></div>

            <div class="intro-logo-wrap">

                <img
                    src="images/logo.png"
                    alt="اردو وائس اسٹوڈیو AI"
                    class="intro-logo"
                >

            </div>

            <div class="intro-caption">

                <strong>
                    اردو وائس اسٹوڈیو AI
                </strong>

                <span>
                    آپ کے الفاظ، آپ کی آواز
                </span>

            </div>

        </section>


        <!-- =================================================
             MAIN STUDIO
        ================================================= -->

        <main class="studio-content">

            <header class="studio-header">

                <div class="studio-brand">

                    <img
                        src="images/logo.png"
                        alt="اردو وائس اسٹوڈیو AI"
                        class="studio-brand-logo"
                    >

                    <div>

                        <h1>
                            اردو وائس اسٹوڈیو AI
                        </h1>

                        <p>
                            اپنے الفاظ کو قدرتی اور واضح آواز دیں۔
                        </p>

                    </div>

                </div>

                <div class="studio-status">
                    Studio Ready
                </div>

            </header>


            <section class="studio-workspace">


                <!-- =================================================
                     TEXT PANEL
                ================================================= -->

                <div class="studio-panel">

                    <h2>
                        اپنا متن یہاں لکھیں
                    </h2>

                    <p class="studio-panel-description">
                        اپنا اردو متن، مضمون، وعظ یا طویل تحریر یہاں شامل کریں۔
                    </p>

                    <textarea
                        id="studioText"
                        class="studio-textarea"
                        placeholder="اپنا اردو متن یہاں لکھیں یا Paste کریں..."
                    ></textarea>

                    <div class="studio-actions">

                        <button
                            type="button"
                            class="studio-button"
                            id="generateButton"
                        >
                            آواز بنائیں
                        </button>

                        <button
                            type="button"
                            class="studio-button secondary"
                            id="clearButton"
                        >
                            صاف کریں
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     SETTINGS PANEL
                ================================================= -->

                <aside class="studio-panel">

                    <h2>
                        آواز کی ترتیبات
                    </h2>

                    <p class="studio-panel-description">
                        اپنی پسند کی زبان، آواز اور رفتار منتخب کریں۔
                    </p>


                    <div class="studio-controls">

                        <div class="studio-control">

                            <label for="studioLanguage">
                                زبان
                            </label>

                            <select
                                id="studioLanguage"
                                class="studio-select"
                            >

                                <option value="ur-PK">
                                    🇵🇰 اردو — پاکستانی
                                </option>

                                <option value="en-US">
                                    🇺🇸 English
                                </option>

                                <option value="ar-SA">
                                    🇸🇦 العربية
                                </option>

                                <option value="hi-IN">
                                    🇮🇳 हिन्दी
                                </option>

                                <option value="es-ES">
                                    🇪🇸 Español
                                </option>

                                <option value="fr-FR">
                                    🇫🇷 Français
                                </option>

                                <option value="de-DE">
                                    🇩🇪 Deutsch
                                </option>

                                <option value="zh-CN">
                                    🇨🇳 中文
                                </option>

                            </select>

                        </div>


                        <div class="studio-control">

                            <label for="studioVoice">
                                آواز
                            </label>

                            <select
                                id="studioVoice"
                                class="studio-select"
                            >

                                <option value="default">
                                    قدرتی آواز
                                </option>

                                <option value="male">
                                    مردانہ آواز
                                </option>

                                <option value="female">
                                    زنانہ آواز
                                </option>

                            </select>

                        </div>


                        <div class="studio-control">

                            <label for="studioSpeed">
                                رفتار
                            </label>

                            <select
                                id="studioSpeed"
                                class="studio-select"
                            >

                                <option value="0.8">
                                    آہستہ
                                </option>

                                <option value="1" selected>
                                    عام رفتار
                                </option>

                                <option value="1.15">
                                    تیز
                                </option>

                                <option value="1.3">
                                    بہت تیز
                                </option>

                            </select>

                        </div>

                    </div>

                </aside>

            </section>

        </main>

    </div>


    <script>

        /* =================================================
           STUDIO INTRO CONTROLLER
        ================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const intro =
                    document.getElementById(
                        "studioIntro"
                    );

                if (!intro) return;


                /*
                    Intro تقریباً 7 سیکنڈ کے بعد
                    خود بخود ختم ہو جائے گا۔
                */

                window.setTimeout(
                    function () {

                        intro.classList.add(
                            "hide"
                        );

                    },
                    7000
                );

            }
        );


        /* =================================================
           CLEAR TEXT
        ================================================= */

        const clearButton =
            document.getElementById(
                "clearButton"
            );

        const studioText =
            document.getElementById(
                "studioText"
            );


        if (clearButton && studioText) {

            clearButton.addEventListener(
                "click",
                function () {

                    studioText.value = "";

                    studioText.focus();

                }
            );

        }


        /* =================================================
           GENERATE PLACEHOLDER
        ================================================= */

        const generateButton =
            document.getElementById(
                "generateButton"
            );


        if (generateButton) {

            generateButton.addEventListener(
                "click",
                function () {

                    if (
                        !studioText ||
                        !studioText.value.trim()
                    ) {

                        alert(
                            "براہِ کرم پہلے اپنا متن لکھیں۔"
                        );

                        return;
                    }


                    alert(
                        "AI آواز بنانے والا نظام اگلے مرحلے میں شامل کیا جائے گا۔"
                    );

                }
            );

        }

    </script>

</body>
</html>
